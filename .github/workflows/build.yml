name: Build Runner Binary

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -o forgejo-k8s-runner-final .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forgejo-k8s-runner-final
          path: forgejo-k8s-runner-final
          retention-days: 1
